services:
  local-auto:
    build: .
    container_name: local-auto
    ports:
      - "3847:3847"
    # Run as the host user so the daemon's auth-token (written to
    # /home/pwuser/.local-auto inside the container) is readable by the
    # CLI on the host (which reads ~/.local-auto/auth-token). pwuser
    # already exists in the Playwright base image with uid=1000.
    user: "1000:1000"
    volumes:
      # Mount config and credentials from host
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      # Share the host's ~/.local-auto with the container so daemon and
      # CLI see the same auth-token, state, and sessions. Host and
      # container both use uid 1000 here.
      - ~/.local-auto:/home/pwuser/.local-auto
    environment:
      # Daemon already binds to 0.0.0.0 via config.yaml for Docker
      - NODE_ENV=production
      # Force HOME so os.homedir() returns /home/pwuser even if /etc/passwd
      # lookup differs. Defensive: matches the volume mount target.
      - HOME=/home/pwuser
      # node-cron evaluates schedules in the timezone given by TZ. Without
      # this, the container defaults to UTC and the "0 9,22 * * *" schedule
      # fires at 09:00 UTC (= 11:00 CEST) and 22:00 UTC (= 00:00 CEST),
      # not at the wall-clock times the user expects.
      - TZ=Europe/Warsaw
    restart: unless-stopped
